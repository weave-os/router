# Local docker stack for the router. Brings up Postgres, applies migrations, and
# starts the server end-to-end. Suitable for `docker compose up` smoke tests.
#
# DEV ONLY — not tuned for production (single-instance Postgres, no resource
# limits, default credentials below). Do not deploy this compose file to any
# environment exposed beyond localhost.
#
# The router defaults to the HMM policy (hmm_embedding) and refuses to boot
# without one, so this stack serves the local-development stub classifier and
# its read-only v5 serving registry from smoke/hmmstub (every turn lands in one
# routing group).
#
# Usage:
#   docker compose up --build
#   # Optional capture in .env.local: ROUTER_HTTP_CAPTURE_FILE=/router-captures/router-traffic.jsonl
#   # Capture output is written to the ignored .local/router-captures/ on the host.
#
# Health checks:
#   curl http://localhost:8080/health
#   curl -H 'Authorization: Bearer rk_invalid' http://localhost:8080/validate  # 401
#
# To seed an installation + API key for testing:
#   docker compose run --rm seed

services:
  postgres:
    image: postgres:15-alpine
    # DEV ONLY credentials — replace before exposing this stack anywhere.
    environment:
      POSTGRES_USER: router
      POSTGRES_PASSWORD: router
      POSTGRES_DB: router
    # Host port 5433 to avoid colliding with the Weave backend's local Postgres
    # on 5432. The router service inside the compose network still talks on the
    # internal :5432, so this only affects manual `psql` from the host.
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U router -d router"]
      interval: 1s
      timeout: 3s
      retries: 30
    volumes:
      - router_postgres_data:/var/lib/postgresql/data
      # Init script runs once on first DB creation. Creates the `router` schema
      # so the migrate sidecar can land its `schema_migrations` table there.
      - ./db/init:/docker-entrypoint-initdb.d:ro

  # Pub/Sub emulator used for cross-replica cache invalidation. In production
  # this is GCP Pub/Sub; locally we run Google's emulator so `docker compose up`
  # is self-contained (no GCP credentials required). The entrypoint pre-creates
  # the invalidation topic; per-replica subscriptions are created by the router
  # itself at startup.
  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    entrypoint: ["/entrypoint.sh"]
    ports:
      - "8085:8085"
    environment:
      PUBSUB_PROJECT_ID: router-local
      PUBSUB_TOPIC_ROUTER_INVALIDATION: router-installation-invalidate
    volumes:
      - ./db/pubsub/entrypoint.sh:/entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8085 >/dev/null || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot migration runner. Exits with status 0 once all pending migrations
  # are applied. The `server` service waits on this via service_completed_successfully
  # so it never starts against an unmigrated DB.
  migrate:
    image: migrate/migrate:v4.17.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db/migrations:/migrations
    # `search_path=router` makes both the migrations themselves and the
    # `schema_migrations` bookkeeping table land in the router schema, so
    # nothing leaks into public. The migrations create the schema themselves
    # (CREATE SCHEMA IF NOT EXISTS router) before any table DDL runs.
    command:
      - "-path=/migrations"
      - "-database=postgres://router:router@postgres:5432/router?sslmode=disable&search_path=router"
      - "up"
    restart: "no"

  server:
    image: router-server
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      pubsub-emulator:
        condition: service_healthy
      hmm-stub:
        condition: service_healthy
    # Load API keys from the same .env files `make dev` uses, so
    # docker compose up and make dev resolve identically. Compose
    # evaluates env_file entries in order; .env.local wins on
    # collisions because it's listed second.
    #
    # NOTE: do not add ANTHROPIC_API_KEY / OPENAI_API_KEY /
    # GOOGLE_API_KEY to the `environment:` block below — that
    # block overrides env_file values, and any "${VAR:-}" form there
    # would silently zero out the env_file value when run in a shell
    # without the var exported. Let env_file be authoritative for the
    # provider keys.
    #
    # Distroless runtime note: the server image has no shell or printenv.
    # Do not use `docker compose exec server printenv` to inspect variables.
    # Instead, verify loaded environment variables using:
    #   docker inspect <container> --format '{{range .Config.Env}}{{slice (split . "=") 0 1}}{{"\n"}}{{end}}'
    # or check the router's boot logs / GET /admin/v1/config endpoint.
    env_file:
      - path: .env.development
        required: false
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: postgres://router:router@postgres:5432/router?sslmode=disable
      PORT: "8080"
      # Pub/Sub broadcast for cross-replica cache invalidation. main.go
      # panics at startup if any of these is unset (config.MustGet). The
      # gcppubsub client honors PUBSUB_EMULATOR_HOST and routes there
      # instead of GCP — so no credentials are needed for local dev.
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      PUBSUB_PROJECT_ID: router-local
      PUBSUB_TOPIC_ROUTER_INVALIDATION: router-installation-invalidate
      PUBSUB_SUBSCRIPTION_ROUTER_INVALIDATION: router-installation-invalidate
      # The server listens on the container interface when capture is enabled;
      # the published port below remains host-loopback-only.
      ROUTER_HTTP_CAPTURE_LISTEN_HOST: "0.0.0.0"
      # Local-development worker identity bound by the stub's v5 serving
      # registry (smoke/hmmstub/serving.go); the router serves it through the
      # same managed serving runtime production uses.
      ROUTER_SERVING_TARGET: prod/stable
      ROUTER_SERVING_PROJECT: local
      ROUTER_SERVING_REGION: local
      ROUTER_SERVING_REVISION: hmm-stub-router
      ROUTER_SERVING_IMAGE_DIGEST: sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
      ROUTER_SERVING_REGISTRY_URI: /policy/registry
      ROUTER_ALLOW_LOCAL_SERVING_REGISTRY: "true"
      ROUTER_SERVING_CONFIGURATION_URI: gs://hmm-stub-fixture/registry/artifacts/5e512326f32fd6b47871cc8927e61e0244ec09a9a6b4258ad9dfc12fe8165af5.json
      ROUTER_SERVING_CONFIGURATION_SHA256: 5e512326f32fd6b47871cc8927e61e0244ec09a9a6b4258ad9dfc12fe8165af5
      ROUTER_SERVING_CONFIGURATION_GENERATION: "1"
      ROUTER_SERVING_SELECTION_SET_URI: gs://hmm-stub-fixture/registry/artifacts/50909073bddd4c1412b5d1cf00a7f57708ab0591d1d65bb8f94e19320862d227.json
      ROUTER_SERVING_SELECTION_SET_SHA256: 50909073bddd4c1412b5d1cf00a7f57708ab0591d1d65bb8f94e19320862d227
      ROUTER_SERVING_SELECTION_SET_GENERATION: "1"
      ROUTER_HMM_SIDECAR_AUTH: none
    volumes:
      # Set ROUTER_HTTP_CAPTURE_FILE=/router-captures/<new-file>.jsonl in
      # .env.local to enable Compose capture and keep the output on the host.
      - ./.local/router-captures:/router-captures
      - hmm_stub_registry:/policy/registry:ro
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  # Local-dev only: stub HMM classifier that also bakes the matching policy
  # release into the shared volume, so the default stack boots with no
  # classifier credentials. Not a production or self-hosted serving path.
  hmm-stub:
    image: router-hmm-stub
    build:
      context: .
      dockerfile: smoke/hmmstub/Dockerfile
    volumes:
      - hmm_stub_registry:/registry
    healthcheck:
      test: ["CMD", "/hmm-stub", "-healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  # Frozen HMM classifier. Start it through `make up-hmm`, which points the
  # router at it instead of the stub. Local-dev only: its legacy v4 policy release
  # comes from ROUTER_POLICY_ENVIRONMENT until a public v5 classifier package exists.
  hmm-sidecar:
    profiles:
      - hmm
    build:
      context: .
      dockerfile: sidecars/hmm/Dockerfile
    env_file:
      - path: .env.development
        required: false
      - path: .env.local
        required: false
    environment:
      PORT: "8093"
      CLASSIFIER_IMAGE_DIGEST: ${CLASSIFIER_IMAGE_DIGEST:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8093/readyz >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # One-shot seed runner. Creates a local-dev installation + API key and
  # prints the raw token with paste-ready configuration for Claude Code and
  # Cursor. Not started by `docker compose up`; invoke explicitly:
  #   docker compose run --rm seed
  seed:
    image: router-seed
    build:
      context: .
      dockerfile: Dockerfile
      target: seed-runtime
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://router:router@postgres:5432/router?sslmode=disable
    profiles:
      - tools
    restart: "no"

volumes:
  hmm_stub_registry:
  router_postgres_data:
