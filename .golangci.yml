version: "2"

run:
  tests: true

linters:
  default: none
  enable:
    - depguard
    - errorlint
  settings:
    errorlint:
      comparison: true
      asserts: true
      errorf: false
    depguard:
      rules:
        leaf:
          files:
            - "**/internal/config/**"
            - "**/internal/observability/*.go"
            - "!**/*_test.go"
          deny:
            - pkg: weave-os/router/internal
              desc: leaf utilities cannot import internal packages
        presentation:
          files:
            - "**/internal/api/**"
            - "**/internal/server/**"
            - "!**/*_test.go"
          deny:
            - pkg: weave-os/router/internal/postgres
            - pkg: weave-os/router/internal/sqlc
            - pkg: weave-os/router/internal/translate
            - pkg: weave-os/router/internal/providers/
            - pkg: github.com/jackc/pgx
        pgx-only-postgres:
          files:
            - "**/internal/**"
            - "!**/internal/postgres/**"
            - "!**/internal/sqlc/**"
            - "!**/*_test.go"
          deny:
            - pkg: github.com/jackc/pgx
        inner-ring-telemetry-port:
          files:
            - "**/internal/inference/**"
            - "**/internal/router/**"
            - "**/internal/providers/*.go"
            - "**/internal/translate/**"
            - "**/internal/sse/**"
            - "**/internal/timing/**"
            - "**/internal/requestcontext/**"
            - "**/internal/feedback/**"
            - "**/internal/auth/**"
            - "**/internal/billing/**"
            - "**/internal/analytics/**"
            - "**/internal/proxy/**"
            - "**/internal/dispatch/**"
            - "**/internal/websearch/**"
            - "**/internal/usage/**"
            - "**/internal/telemetry/**"
            - "!**/*_test.go"
          deny:
            - pkg: weave-os/router/internal/observability/otel
              desc: inner-ring packages record through internal/telemetry; cmd/router wires the otel adapter
            - pkg: weave-os/router/internal/observability/apm
              desc: inner-ring packages record through internal/telemetry; cmd/router wires the apm adapter
