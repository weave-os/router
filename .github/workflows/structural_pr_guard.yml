# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Structural PR guard

# A structural PR (title `refactor:` / `refactor(scope):`, or the `structural`
# label) must leave every golden byte-identical. Title and label edits re-run
# this check; it reports success on PRs it does not apply to so it can be a
# required check.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: structural-pr-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  structural-pr-guard:
    name: Structural PR guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: go.sum

      - name: Check golden files
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff -z --no-renames --name-only "$BASE_SHA...$HEAD_SHA" | go run ./scripts/structural_pr_guard
