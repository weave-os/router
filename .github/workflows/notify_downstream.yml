# Optional activation: DOWNSTREAM_WORKFLOW_DISPATCH is JSON with repository,
# workflow (a .yml/.yaml filename), and ref. DOWNSTREAM_WORKFLOW_TOKEN must be
# allowed to dispatch that workflow. Without destination configuration this skips.
name: Notify downstream after tests
on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main]
permissions:
  actions: read
  contents: read
jobs:
  notify:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Only reviewed default-branch code runs with destination credentials.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.12.0

      - name: Notify configured downstream workflow
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DOWNSTREAM_WORKFLOW_TOKEN: ${{ secrets.DOWNSTREAM_WORKFLOW_TOKEN }}
          DOWNSTREAM_WORKFLOW_DISPATCH: ${{ secrets.DOWNSTREAM_WORKFLOW_DISPATCH }}
        run: node .github/scripts/notify-downstream.mjs
