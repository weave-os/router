# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Documentation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check generated guides and references
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Check generated agent guides
        run: make check-agent-guides

      - name: Check documentation references
        run: make check-docs

      - name: Test agent validation tools
        run: python3 -m unittest discover -s scripts -p 'test_agent_checks.py'

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.12.0

      - name: Test downstream notifications
        run: node --test .github/tests/notify-downstream.test.mjs
